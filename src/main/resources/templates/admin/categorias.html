<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4 estreito-largo">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h1 class="h3 mb-0">Categorias</h1>
        <a class="btn btn-acento" th:href="@{/admin/categorias/nova}">Nova categoria</a>
    </div>
    <div class="table-responsive painel">
        <table class="table align-middle mb-0">
            <thead><tr><th>Nome</th><th>Descrição</th><th class="text-end">Ações</th></tr></thead>
            <tbody>
                <tr th:each="c : ${categorias}">
                    <td th:text="${c.nome}"></td>
                    <td th:text="${c.descricao}"></td>
                    <td class="text-end">
                        <div class="d-flex gap-1 justify-content-end">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/categorias/{id}/editar(id=${c.id})}">Editar</a>
                            <form th:action="@{/admin/categorias/{id}/excluir(id=${c.id})}" method="post"
                                  onsubmit="return confirm('Excluir esta categoria?')">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
