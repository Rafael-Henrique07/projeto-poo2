<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${categoriaId != null} ? 'Editar categoria' : 'Nova categoria')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4 estreito">
    <h1 class="h3 mb-3" th:text="${categoriaId != null} ? 'Editar categoria' : 'Nova categoria'">Categoria</h1>
    <form th:action="${categoriaId != null} ? @{/admin/categorias/{id}/editar(id=${categoriaId})} : @{/admin/categorias/nova}"
          method="post" th:object="${form}" class="painel" novalidate>
        <div class="mb-3">
            <label class="form-label" for="nome">Nome</label>
            <input class="form-control" th:field="*{nome}" id="nome" maxlength="60" required>
            <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="descricao">Descrição</label>
            <input class="form-control" th:field="*{descricao}" id="descricao" maxlength="255">
            <div class="erro-campo" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-acento" type="submit">Salvar</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/categorias}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
