<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fotos do anúncio')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4 estreito-largo">
    <h1 class="h3 mb-1">Fotos do anúncio</h1>
    <p class="mb-3"><a th:href="@{/anuncios/{id}(id=${anuncio.id})}" th:text="${anuncio.titulo}">Título</a></p>

    <div class="painel mb-3" th:if="${#lists.isEmpty(anuncio.fotos)}">
        <p class="mb-0">Este anúncio ainda não tem fotos.</p>
    </div>
    <div class="lista-fotos">
        <article class="painel item-foto" th:each="f, i : ${anuncio.fotos}">
            <img th:src="@{/uploads/{n}(n=${f.caminhoArquivo})}" th:alt="'Foto ' + ${i.count}">
            <div class="flex-grow-1">
                <p class="mb-1 fw-bold" th:text="'Foto ' + ${i.count}">Foto 1</p>
                <span class="badge text-bg-success" th:if="${f.principal}">Principal</span>
            </div>
            <div class="d-flex flex-wrap gap-1 justify-content-end">
                <form th:action="@{/anuncios/{id}/fotos/{f}/mover(id=${anuncio.id},f=${f.id})}" method="post">
                    <input type="hidden" name="paraCima" value="true">
                    <button class="btn btn-sm btn-outline-secondary" type="submit" th:disabled="${i.first}" aria-label="Mover para cima">↑</button>
                </form>
                <form th:action="@{/anuncios/{id}/fotos/{f}/mover(id=${anuncio.id},f=${f.id})}" method="post">
                    <input type="hidden" name="paraCima" value="false">
                    <button class="btn btn-sm btn-outline-secondary" type="submit" th:disabled="${i.last}" aria-label="Mover para baixo">↓</button>
                </form>
                <form th:unless="${f.principal}" th:action="@{/anuncios/{id}/fotos/{f}/principal(id=${anuncio.id},f=${f.id})}" method="post">
                    <button class="btn btn-sm btn-outline-secondary" type="submit">Tornar principal</button>
                </form>
                <form th:action="@{/anuncios/{id}/fotos/{f}/remover(id=${anuncio.id},f=${f.id})}" method="post"
                      onsubmit="return confirm('Remover esta foto?')">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Remover</button>
                </form>
            </div>
        </article>
    </div>

    <form th:action="@{/anuncios/{id}/fotos(id=${anuncio.id})}" method="post" enctype="multipart/form-data" class="painel mt-3">
        <label class="form-label" for="fotos">Adicionar fotos (JPG ou PNG, até 5 MB cada, máximo de 15 no total)</label>
        <input class="form-control mb-2" type="file" name="fotos" id="fotos" multiple accept="image/jpeg,image/png" required>
        <button class="btn btn-acento" type="submit">Enviar fotos</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
