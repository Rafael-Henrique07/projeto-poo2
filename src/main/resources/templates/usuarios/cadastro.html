<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4 estreito">
    <h1 class="h3 mb-3">Criar conta</h1>
    <form th:action="@{/cadastro}" method="post" th:object="${form}" class="painel" novalidate>
        <th:block th:replace="~{fragments/usuario :: campos}"></th:block>
        <div class="mb-3">
            <label class="form-label" for="senha">Senha (mínimo de 8 caracteres)</label>
            <input class="form-control" type="password" name="senha" id="senha" maxlength="72" autocomplete="new-password" required>
            <div class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
        </div>
        <button class="btn btn-acento w-100" type="submit">Criar conta</button>
        <p class="mt-3 mb-0 text-center">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
