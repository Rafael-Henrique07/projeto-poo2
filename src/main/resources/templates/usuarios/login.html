<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4 estreito">
    <h1 class="h3 mb-3">Entrar</h1>
    <form th:action="@{/login}" method="post" class="painel">
        <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" type="email" name="email" id="email" th:value="${email}" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" type="password" name="senha" id="senha" autocomplete="current-password" required>
        </div>
        <button class="btn btn-acento w-100" type="submit">Entrar</button>
        <p class="mt-3 mb-0 text-center">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
