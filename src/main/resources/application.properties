spring.application.name=projeto_poo2

spring.config.import=optional:file:./config-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veiculos_bd?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=80MB
server.tomcat.max-swallow-size=-1
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

app.uploads.dir=uploads
